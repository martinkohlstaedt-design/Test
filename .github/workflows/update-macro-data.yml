name: Update and deploy macro dashboard

on:
  schedule:
    - cron: "17 6 * * 1-5"   # werktags 06:17 UTC
  workflow_dispatch:
  push:
    branches: [claude/stoic-lovelace-h5n4lr]
    paths:
      - "macro-dashboard/**"
      - ".github/workflows/update-macro-data.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macro-dashboard
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data
        if: github.event_name != 'push'
        working-directory: macro-dashboard
        run: python3 fetch_data.py

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- macro-dashboard/data/us.json; then
            echo "Keine Änderungen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro-dashboard/data/us.json
          git commit -m "Update macro data $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: macro-dashboard

      - id: deploy
        uses: actions/deploy-pages@v4
