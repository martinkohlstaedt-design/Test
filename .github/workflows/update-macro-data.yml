name: Update macro dashboard data

on:
  schedule:
    - cron: "17 6 * * 1-5"   # werktags 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-macro-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data
        working-directory: macro-dashboard
        run: python3 fetch_data.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- macro-dashboard/data/us.json; then
            echo "Keine Änderungen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro-dashboard/data/us.json
          git commit -m "Update macro data $(date -u +%F)"
          git push
