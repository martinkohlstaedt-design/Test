<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>BVB Elfmeterschießen</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0b;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #stage{position:absolute;left:0;top:0;width:400px;height:720px;transform-origin:0 0}
  canvas{position:absolute;left:0;top:0;width:400px;height:720px;display:block}
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.78);color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  .overlay.show{display:flex}
  h1{margin:0 0 4px;font-size:34px;line-height:1.05;color:#fde100;letter-spacing:1px;text-transform:uppercase}
  h2{margin:0 0 6px;font-size:44px;color:#fde100}
  p{margin:6px 0;color:#ddd;font-size:15px;line-height:1.35}
  .sub{color:#fde100;font-weight:700;margin-bottom:18px}
  button{display:block;width:240px;margin:8px auto;padding:14px 0;font-size:20px;font-weight:800;border:0;
    border-radius:12px;background:#fde100;color:#000;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.97);background:#e6cb00}
  button.alt{background:#2a2a2a;color:#fde100;border:2px solid #fde100;padding:12px 0}
  .stats{font-size:13px;color:#aaa;margin-top:12px}
  #snd{position:absolute;right:8px;top:84px;width:36px;height:36px;padding:0;margin:0;font-size:18px;
    border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:1px solid #666}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <button id="snd" aria-label="Ton">🔊</button>

  <div id="menu" class="overlay show">
    <h1>Elfmeter-<br>schießen</h1>
    <div class="sub">BVB · Du schießt, der Torwart hält automatisch</div>
    <p><b>Wische nach oben</b> vom Ball aus:<br>
       Richtung = Ecke · Tempo = Höhe<br>
       Zu schnell → drüber, zu weit → vorbei!</p>
    <p>5 Schüsse pro Team, abwechselnd. Steht der Sieger vorher fest, ist Schluss. Bei Gleichstand: Sudden Death.</p>
    <div style="height:10px"></div>
    <button data-d="easy">Leicht</button>
    <button data-d="medium">Mittel</button>
    <button data-d="hard">Schwer</button>
    <div class="stats" id="stats"></div>
  </div>

  <div id="end" class="overlay">
    <h2 id="endT">SIEG!</h2>
    <p id="endS" style="font-size:26px;color:#fff;font-weight:800"></p>
    <p id="endD"></p>
    <div style="height:14px"></div>
    <button id="again">Nochmal</button>
    <button id="toMenu" class="alt">Schwierigkeit ändern</button>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- Konfiguration ----------
const PLAYER = { name: 'BVB', number: 10 };           // Trikotnummer des Schützen
const W = 400, H = 720;
const GL = 60, GR = 340, GT = 212, GB = 305, CX = 200; // Tor: links, rechts, Latte, Linie
const SPOT = { x: 200, y: 600 };
const DIFF = {
  easy:   { label: 'Leicht', guess: 0.28, reach: 40, opp: 0.60, delay: 0.30, aim: true  },
  medium: { label: 'Mittel', guess: 0.42, reach: 44, opp: 0.74, delay: 0.18, aim: false },
  hard:   { label: 'Schwer', guess: 0.58, reach: 48, opp: 0.84, delay: 0.08, aim: false },
};
const KICK_LEAD = 0.30;                                // Anlauf in s

// ---------- Helfer ----------
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 3);
cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const ease = t => 1 - (1 - t) * (1 - t);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  $('stage').style.transform =
    `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

// ---------- Ton ----------
let audio = null, soundOn = true;
function ac() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audio && audio.state === 'suspended') audio.resume();
  return audio;
}
function tone(f, d, type = 'sine', vol = 0.15, slide = 0) {
  if (!soundOn || !ac()) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = f;
  if (slide) o.frequency.linearRampToValueAtTime(f + slide, audio.currentTime + d);
  g.gain.setValueAtTime(vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d);
  o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
}
function noise(d, vol = 0.12) {
  if (!soundOn || !ac()) return;
  const n = Math.floor(audio.sampleRate * d), b = audio.createBuffer(1, n, audio.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = audio.createBufferSource(), g = audio.createGain(); g.gain.value = vol;
  s.buffer = b; s.connect(g); g.connect(audio.destination); s.start();
}
const sfx = {
  kick:  () => { tone(140, 0.12, 'triangle', 0.35, -80); noise(0.06, 0.15); },
  whistle: () => { tone(2600, 0.35, 'sine', 0.08); },
  goal:  () => { noise(1.2, 0.22); tone(520, 0.2, 'triangle', 0.1); setTimeout(() => tone(780, 0.3, 'triangle', 0.1), 150); },
  save:  () => { tone(200, 0.15, 'square', 0.1, -80); noise(0.15, 0.1); },
  post:  () => { tone(900, 0.5, 'sine', 0.2, -300); },
  miss:  () => { tone(300, 0.4, 'sawtooth', 0.07, -150); },
  win:   () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'triangle', 0.15), i * 140)); },
  lose:  () => { [392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, 0.4, 'sawtooth', 0.08), i * 200)); },
};
$('snd').onclick = e => { e.stopPropagation(); soundOn = !soundOn; $('snd').textContent = soundOn ? '🔊' : '🔇'; };

// ---------- Hintergrund (einmal vorrendern) ----------
const bg = document.createElement('canvas'); bg.width = W * DPR; bg.height = H * DPR;
(function drawBg() {
  const c = bg.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Tribüne
  const sg = c.createLinearGradient(0, 0, 0, 170); sg.addColorStop(0, '#0c0c10'); sg.addColorStop(1, '#23232a');
  c.fillStyle = sg; c.fillRect(0, 0, W, 175);
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 1100; i++) {
    const x = r() * W, y = 6 + r() * 160, k = r();
    c.fillStyle = k < 0.55 ? '#fde100' : k < 0.8 ? '#111' : k < 0.92 ? '#fff' : '#d9a300';
    c.globalAlpha = 0.5 + r() * 0.5;
    c.beginPath(); c.arc(x, y, 2 + r() * 2.2, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  // Bande
  c.fillStyle = '#0a0a0a'; c.fillRect(0, 172, W, 30);
  c.fillStyle = '#fde100'; c.font = '800 17px system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('BVB 09   ·   ECHTE LIEBE   ·   BVB 09', CX, 187);
  c.fillRect(0, 170, W, 3);
  // Rasen
  let y = 202, i = 0;
  while (y < H) {
    const h = 16 + i * 7;
    c.fillStyle = i % 2 ? '#2f8f3e' : '#37a048'; c.fillRect(0, y, W, h);
    y += h; i++;
  }
  // Linien
  c.strokeStyle = '#fff'; c.lineWidth = 3; c.globalAlpha = 0.9;
  c.beginPath(); c.moveTo(0, GB); c.lineTo(W, GB); c.stroke();                 // Torlinie
  c.beginPath(); c.moveTo(95, GB); c.lineTo(80, 362); c.lineTo(320, 362); c.lineTo(305, GB); c.stroke(); // 5er
  c.beginPath(); c.moveTo(0, 452); c.lineTo(W, 452); c.stroke();               // 16er
  c.beginPath(); c.ellipse(CX, 452, 120, 48, 0, 0, Math.PI); c.stroke();      // Bogen
  c.globalAlpha = 1; c.fillStyle = '#fff';
  c.beginPath(); c.arc(SPOT.x, SPOT.y + 8, 5, 0, 7); c.fill();                 // Punkt
})();

// ---------- Spielzustand ----------
let diffKey = 'medium', D = DIFF.medium;
let res, turn, phase, shot, banner, aimInfo, keeperIdle = 0, finished = false;
// phase: 'menu' | 'aim' | 'shot' | 'wait' | 'end'

function seriesDone() {
  const nm = res.me.length, no = res.opp.length;
  const gm = res.me.filter(x => x === 'goal').length, go = res.opp.filter(x => x === 'goal').length;
  if (nm === no && nm >= 5) return gm !== go ? (gm > go ? 'me' : 'opp') : null;
  if (nm <= 5 && no <= 5) {
    const rm = 5 - nm, ro = 5 - no;
    if (gm > go + ro) return 'me';
    if (go > gm + rm) return 'opp';
  }
  return null;
}
const goals = a => a.filter(x => x === 'goal').length;

function startMatch(k) {
  diffKey = k; D = DIFF[k];
  res = { me: [], opp: [] }; turn = 'me'; shot = null; banner = null; finished = false;
  $('menu').classList.remove('show'); $('end').classList.remove('show');
  sfx.whistle();
  beginTurn();
}

function beginTurn() {
  shot = null; aimInfo = null;
  if (turn === 'me') { phase = 'aim'; setBanner('Du schießt!', '#fde100', 1.0, 38); }
  else {
    phase = 'wait'; setBanner('Gegner schießt …', '#ff8a8a', 1.1, 34);
    setTimeout(oppShoot, 1200);
  }
}

function setBanner(text, color, dur, size = 56) { banner = { text, color, t: 0, dur, size }; }

// ---------- Schussberechnung ----------
function calcTarget(dx, dy, v) {
  const ratio = dx / Math.max(1, -dy);
  const tx = CX + ratio * 190;
  const h = clamp((v - 0.5) / 2.0, 0, 1.4);          // 0 = flach, 1 = Lattenhöhe
  const ty = GB - 2 - h * (GB - GT - 2);
  return { tx, ty, h, p: clamp(v / 1.8, 0.25, 1.3) };
}

function randomKeeperSpot() {
  return { x: CX + rnd(-1, 1) * 105, y: rnd(GT + 28, GB - 12) };
}

function resolveMine(t) {
  const { tx, ty, h, p } = t;
  const out = { tx, ty, dur: lerp(1.0, 0.5, Math.min(p, 1)) };
  const post = Math.min(Math.abs(tx - GL), Math.abs(tx - GR)) < 7;
  const bar = Math.abs(ty - GT) < 5;
  let result;
  if (tx < GL - 6 || tx > GR + 6) result = 'wide';
  else if (h > 1.07) result = 'over';
  else if ((post && tx >= GL - 6 && tx <= GR + 6) || bar) result = Math.random() < 0.55 ? 'post' : 'in';
  else result = 'in';
  let k;
  if (result === 'in') {
    const guessed = Math.random() < D.guess;
    if (guessed) {
      const noise = 16 + 14 * clamp(h, 0, 1);
      k = { x: clamp(tx + gauss() * noise, CX - 118, CX + 118), y: clamp(ty + gauss() * noise, GT + 22, GB - 8) };
    } else k = randomKeeperSpot();
    const reach = D.reach * (1 - 0.28 * clamp(p - 0.4, 0, 0.9));
    result = Math.hypot(k.x - tx, (k.y - ty) * 1.0) < reach ? 'save' : 'goal';
  } else {
    k = randomKeeperSpot();
  }
  out.result = result; out.k = k;
  return out;
}

function makeOppShot() {
  const out = { dur: rnd(0.65, 0.9) };
  const rr = Math.random();
  const rest = (1 - D.opp);
  let result;
  if (rr < D.opp) result = 'goal';
  else if (rr < D.opp + rest * 0.6) result = 'save';
  else if (rr < D.opp + rest * 0.85) result = Math.random() < 0.5 ? 'wide' : 'over';
  else result = 'post';
  const side = Math.random() < 0.5 ? -1 : 1;
  let tx = CX + side * rnd(35, 125), ty = rnd(GT + 10, GB - 6);
  if (result === 'wide') { tx = CX + side * rnd(150, 185); ty = rnd(GT + 10, GB - 5); }
  if (result === 'over') { ty = GT - rnd(15, 40); }
  if (result === 'post') { tx = side > 0 ? GR : GL; ty = rnd(GT + 12, GB - 20); }
  let k;
  if (result === 'save') k = { x: tx + gauss() * 8, y: ty + gauss() * 8 };
  else if (result === 'goal') k = { x: CX - side * rnd(10, 95) + (Math.random() < 0.2 ? side * 70 : 0), y: rnd(GT + 28, GB - 12) };
  else k = randomKeeperSpot();
  out.tx = tx; out.ty = ty; out.result = result; out.k = k;
  return out;
}

// ---------- Schuss ausführen ----------
function launch(who, s) {
  shot = Object.assign({ who, s: 0, done: false, ended: false }, s);
  phase = 'shot';
  setTimeout(() => sfx.kick(), KICK_LEAD * 1000);
}

function oppShoot() { if (phase === 'wait') launch('opp', makeOppShot()); }

function finishShot() {
  const r = shot.result, ok = r === 'goal';
  (shot.who === 'me' ? res.me : res.opp).push(ok ? 'goal' : 'miss');
  const mine = shot.who === 'me';
  if (r === 'goal') { setBanner(mine ? 'TOOOR!' : 'Gegentor!', mine ? '#fde100' : '#ff6b6b', 1.3); sfx.goal(); if (mine && navigator.vibrate) navigator.vibrate([60, 40, 120]); }
  else if (r === 'save') { setBanner(mine ? 'GEHALTEN!' : 'Gehalten!', mine ? '#ff6b6b' : '#7dff9a', 1.3); sfx.save(); }
  else if (r === 'post') { setBanner(Math.abs(shot.ty - GT) < 6 ? 'LATTE!' : 'PFOSTEN!', '#fff', 1.3); sfx.post(); }
  else { setBanner(r === 'over' ? 'DRÜBER!' : 'DANEBEN!', mine ? '#ff6b6b' : '#7dff9a', 1.3); sfx.miss(); }
  setTimeout(afterShot, 1700);
}

function afterShot() {
  const w = seriesDone();
  if (w) return endMatch(w);
  turn = turn === 'me' ? 'opp' : 'me';
  beginTurn();
}

function endMatch(w) {
  phase = 'end'; finished = true;
  const win = w === 'me', gm = goals(res.me), go = goals(res.opp);
  $('endT').textContent = win ? 'SIEG! 🏆' : 'Niederlage';
  $('endT').style.color = win ? '#fde100' : '#ff6b6b';
  $('endS').textContent = `BVB ${gm} : ${go} Gegner`;
  $('endD').textContent = `${DIFF[diffKey].label} · ${res.me.length} Schüsse` + (res.me.length > 5 ? ' (Sudden Death)' : '');
  if (win) { try { const k = 'bvbElfer_' + diffKey; localStorage.setItem(k, (+localStorage.getItem(k) || 0) + 1); } catch (e) {} sfx.win(); }
  else sfx.lose();
  updateStats();
  $('end').classList.add('show');
}

function updateStats() {
  let t = '';
  try { t = Object.keys(DIFF).map(k => `${DIFF[k].label}: ${+localStorage.getItem('bvbElfer_' + k) || 0} Siege`).join(' · '); } catch (e) {}
  $('stats').textContent = t;
}
updateStats();

// ---------- Eingabe ----------
let drag = null;
function pt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H, t: performance.now() }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); ac();
  if (phase !== 'aim') return;
  const p = pt(e); if (p.y < 330) return;
  cv.setPointerCapture(e.pointerId);
  drag = { start: p, pts: [p] };
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pt(e); drag.pts.push(p);
  if (drag.pts.length > 40) drag.pts.shift();
});
function release(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (phase !== 'aim') return;
  const p = pt(e); d.pts.push(p);
  const v = swipeVec(d);
  if (!v || -v.dy < 50) { setBanner('Wisch kräftig nach oben!', '#fff', 1.0, 28); return; }
  const t = calcTarget(v.dx, v.dy, v.v);
  // kleine Ungenauigkeit: Nervosität
  t.tx += gauss() * 3; t.ty += gauss() * 2;
  launch('me', resolveMine(t));
  if (navigator.vibrate) navigator.vibrate(15);
}
function swipeVec(d) {
  const a = d.start, b = d.pts[d.pts.length - 1];
  const dx = b.x - a.x, dy = b.y - a.y;
  // Geschwindigkeit der letzten ~100 ms
  let j = d.pts.length - 1;
  while (j > 0 && b.t - d.pts[j - 1].t < 100) j--;
  const q = d.pts[j], dt = Math.max(16, b.t - q.t);
  const v = Math.hypot(b.x - q.x, b.y - q.y) / dt;
  if (!isFinite(v)) return null;
  return { dx, dy, v };
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', () => { drag = null; });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

document.querySelectorAll('#menu button[data-d]').forEach(b => b.onclick = () => { ac(); startMatch(b.dataset.d); });
$('again').onclick = () => startMatch(diffKey);
$('toMenu').onclick = () => { $('end').classList.remove('show'); $('menu').classList.add('show'); phase = 'menu'; };

// ---------- Zeichnen ----------
function drawNet() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(GL, GT, GR - GL, GB - GT);
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = GL; x <= GR; x += 10) { ctx.moveTo(x, GT); ctx.lineTo(x, GB); }
  for (let y = GT; y <= GB; y += 10) { ctx.moveTo(GL, y); ctx.lineTo(GR, y); }
  ctx.stroke(); ctx.restore();
}
function drawFrame() {
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineCap = 'round'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(GL, GB + 2); ctx.lineTo(GL, GT); ctx.lineTo(GR, GT); ctx.lineTo(GR, GB + 2); ctx.stroke();
  ctx.restore();
}

function person(x, y, sc, kit, k = 0, back = true, label = '') {
  // x,y = Fußpunkt, Figur ca. 100*sc hoch
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0, 2, 30, 8, 0, 0, 7); ctx.fill();
  const skin = '#e0ac84';
  // Beine
  const leg = (x0, ang, len) => {
    ctx.save(); ctx.translate(x0, -50); ctx.rotate(ang);
    ctx.fillStyle = skin; ctx.fillRect(-6, 0, 12, len * 0.45);
    ctx.fillStyle = kit.sock; ctx.fillRect(-6.5, len * 0.45, 13, len * 0.45);
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(-8, len * 0.9 - 2, 16, 8, 3); ctx.fill();
    ctx.restore();
  };
  leg(-11, 0, 50);
  leg(11, -0.35 * Math.sin(k * Math.PI) - (k > 0.5 ? 0.25 : 0), 50 - 14 * Math.sin(k * Math.PI));
  // Shorts
  ctx.fillStyle = kit.shorts; ctx.beginPath(); ctx.roundRect(-20, -62, 40, 20, 5); ctx.fill();
  // Torso
  ctx.fillStyle = kit.shirt; ctx.beginPath(); ctx.roundRect(-22, -108, 44, 50, 9); ctx.fill();
  if (kit.stripe) { ctx.fillStyle = kit.stripe; ctx.fillRect(-22, -75, 44, 6); }
  // Arme
  ctx.fillStyle = kit.shirt; ctx.beginPath(); ctx.roundRect(-33, -106, 12, 32, 6); ctx.roundRect(21, -106, 12, 32, 6); ctx.fill();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(-27, -70, 6, 0, 7); ctx.arc(27, -70, 6, 0, 7); ctx.fill();
  // Kopf
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, -121, 12, 0, 7); ctx.fill();
  ctx.fillStyle = kit.hair; ctx.beginPath(); ctx.arc(0, -123, 12, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
  if (back) { ctx.fillStyle = kit.hair; ctx.beginPath(); ctx.arc(0, -121, 12, 0, 7); ctx.fill(); }
  // Nummer
  if (label) { ctx.fillStyle = kit.num; ctx.font = '900 26px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, 0, -80); }
  ctx.restore();
}
const KIT_BVB = { shirt: '#fde100', shorts: '#111', sock: '#fde100', num: '#111', hair: '#3a2a1d', stripe: null };
const KIT_OPP = { shirt: '#d62828', shorts: '#fff', sock: '#d62828', num: '#fff', hair: '#222', stripe: null };

function keeper(x, y, p, angle, kit) {
  // x,y = Körpermitte
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  const skin = '#d9a37a';
  ctx.fillStyle = kit.shorts; ctx.beginPath(); ctx.roundRect(-10, 2, 20, 14, 3); ctx.fill();
  ctx.fillStyle = '#222'; ctx.fillRect(-9, 15, 7, 20); ctx.fillRect(2, 15, 7, 20);
  ctx.fillStyle = kit.shirt; ctx.beginPath(); ctx.roundRect(-11, -22, 22, 26, 5); ctx.fill();
  // Arme (heben beim Hechten)
  const up = 0.25 + 0.75 * p;
  ctx.save(); ctx.translate(-11, -18); ctx.rotate(-(0.5 + up * 1.2)); ctx.fillStyle = kit.shirt; ctx.fillRect(-4, -22, 8, 22);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -25, 6, 0, 7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(11, -18); ctx.rotate(0.5 + up * 1.2); ctx.fillStyle = kit.shirt; ctx.fillRect(-4, -22, 8, 22);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -25, 6, 0, 7); ctx.fill(); ctx.restore();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, -30, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0, -32, 8, Math.PI, Math.PI * 2); ctx.fill();
  ctx.restore();
}
const KEEP_OPP = { shirt: '#ff7a1a', shorts: '#222' };   // Torwart des Gegners (wenn ich schieße)
const KEEP_MINE = { shirt: '#18a957', shorts: '#222' };  // BVB-Torwart (wenn der Gegner schießt)

function drawBall(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#222'; ctx.rotate(rot);
  for (let i = 0; i < 5; i++) { ctx.rotate(Math.PI * 2 / 5); ctx.beginPath(); ctx.arc(r * 0.62, 0, r * 0.2, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.restore();
}

function drawScore() {
  ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, 0, W, 76);
  const rows = [['BVB', res.me, '#fde100'], ['GEG', res.opp, '#ff6b6b']];
  const n = Math.max(5, res.me.length + (turn === 'me' && phase !== 'end' && res.me.length >= res.opp.length ? 1 : 0), res.opp.length + (res.opp.length < res.me.length ? 1 : 0));
  const cnt = Math.min(n, 10), step = Math.min(30, 230 / cnt);
  rows.forEach(([name, arr, col], i) => {
    const y = 22 + i * 30;
    ctx.fillStyle = col; ctx.font = '800 16px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(name, 14, y);
    const off = Math.max(0, arr.length - cnt);
    for (let j = 0; j < cnt; j++) {
      const x = 70 + j * step + step / 2, v = arr[j + off];
      ctx.beginPath(); ctx.arc(x, y, 10, 0, 7);
      ctx.fillStyle = v === 'goal' ? '#2ecc71' : v === 'miss' ? '#e74c3c' : 'rgba(255,255,255,.12)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
      if (v) { ctx.fillStyle = '#fff'; ctx.font = '800 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(v === 'goal' ? '✓' : '✕', x, y + 1); }
    }
    ctx.fillStyle = '#fff'; ctx.font = '900 26px system-ui,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(goals(arr), W - 52, y);
  });
  ctx.fillStyle = '#aaa'; ctx.font = '700 11px system-ui'; ctx.textAlign = 'right';
  ctx.fillText(D.label.toUpperCase(), W - 12, 66);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);
  if (!res) return;

  const sh = shot;
  const mine = !sh ? turn === 'me' : sh.who === 'me';
  const shooterKit = mine ? KIT_BVB : KIT_OPP;
  const keepKit = mine ? KEEP_OPP : KEEP_MINE;

  drawNet();

  // Torwart
  let kx = CX, ky = GB - 38, kp = 0, ka = 0;
  if (!sh) { kx = CX + Math.sin(keeperIdle * 2) * 5; }
  else {
    const t = (sh.s - KICK_LEAD) / sh.dur;
    const start = D.delay, span = 0.55;
    kp = clamp((t - start) / span, 0, 1); kp = ease(kp);
    const targetBody = { x: sh.k.x, y: clamp(sh.k.y + 14, GT + 40, GB - 24) };
    kx = lerp(CX, targetBody.x, kp); ky = lerp(GB - 38, targetBody.y, kp);
    ka = clamp((sh.k.x - CX) / 110, -1, 1) * 1.25 * kp;
    if (sh.k.y < GB - 50) ka *= 0.8;
  }
  keeper(kx, ky, kp, ka, keepKit);

  // Ball
  let bx = SPOT.x, by = SPOT.y, br = 15, sx = SPOT.x, sy = SPOT.y + 12, sr = 1, rot = 0;
  if (sh) {
    const t = (sh.s - KICK_LEAD) / sh.dur;
    if (t > 0) {
      const tt = Math.min(t, 1), e = tt;
      const ground = lerp(SPOT.y, GB, e);
      const hh = clamp((GB - sh.ty) / (GB - GT), 0.1, 1.6);
      const hgt = (GB - sh.ty) * e + 24 * hh * Math.sin(Math.PI * e);
      bx = lerp(SPOT.x, sh.tx, e); by = ground - hgt * lerp(1, 0.6, e) - 12 * (1 - e);
      br = 15 * lerp(1, 0.32, ease(e)); sx = bx; sy = ground; sr = lerp(1, 0.4, e);
      rot = t * 18;
      if (t > 1) {
        const u = sh.s - KICK_LEAD - sh.dur;
        if (sh.result === 'goal') { by = lerp(sh.ty, GB - 6, clamp(u * 2.2, 0, 1)); sy = GB; }
        else if (sh.result === 'save') {
          const dir = sh.tx >= CX ? 1 : -1;
          bx = sh.tx + dir * 90 * u; by = sh.ty + 330 * u * u - 80 * u; br = 5 + 12 * u; sy = by + 8;
        } else if (sh.result === 'post') {
          const dir = sh.tx >= CX ? 1 : -1;
          bx = sh.tx + dir * 60 * u; by = sh.ty + 420 * u * u - 50 * u; br = 5 + 10 * u; sy = by + 8;
        } else {
          const dir = sh.tx >= CX ? 1 : -1;
          if (sh.result === 'wide') { bx = sh.tx + dir * 160 * u; by = sh.ty + 40 * u + 80 * u * u; }
          else { by = sh.ty - 160 * u + 60 * u * u; bx = sh.tx + (sh.tx - SPOT.x) * 0.4 * u; }
          br = 5 * (1 - 0.3 * u); sy = by + 8;
        }
      }
    }
  }
  if (!(sh && sh.result === 'goal' && false)) {
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(sx, sy, 12 * sr, 4 * sr, 0, 0, 7); ctx.fill();
  }
  drawBall(bx, by, br, rot);
  drawFrame();

  // Schütze (vor dem Ball, von hinten)
  const kk = sh ? clamp(sh.s / KICK_LEAD, 0, 1) : 0;
  const run = sh ? ease(kk) * 26 : 0;
  const fade = sh && sh.s > KICK_LEAD + 0.5 ? clamp(1 - (sh.s - KICK_LEAD - 0.5) / 0.4, 0, 1) : 1;
  ctx.save(); ctx.globalAlpha = fade;
  person(158 + run * 0.35, 668 - run * 0.65, 1.15, shooterKit, kk, true, mine ? String(PLAYER.number) : '7');
  ctx.restore();
  // Ball nochmal über die Beine, wenn noch am Punkt
  if (!sh || sh.s < KICK_LEAD + 0.02) drawBall(SPOT.x, SPOT.y, 15, 0);

  // Zielhilfe
  if (drag && phase === 'aim') {
    const v = swipeVec(drag);
    if (v) {
      const b = drag.pts[drag.pts.length - 1];
      ctx.strokeStyle = 'rgba(253,225,0,.85)'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.setLineDash([2, 9]);
      ctx.beginPath(); ctx.moveTo(drag.start.x, drag.start.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
      if (D.aim && -v.dy > 20) {
        const t = calcTarget(v.dx, v.dy, v.v);
        const ok = t.tx > GL && t.tx < GR && t.h <= 1.0;
        ctx.strokeStyle = ok ? '#2ecc71' : '#e74c3c'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(clamp(t.tx, 10, W - 10), clamp(t.ty, 120, GB), 11, 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(t.tx - 17, t.ty); ctx.lineTo(t.tx + 17, t.ty); ctx.moveTo(t.tx, t.ty - 17); ctx.lineTo(t.tx, t.ty + 17); ctx.stroke();
      }
    }
  }
  if (phase === 'aim' && !drag && res.me.length === 0) {
    // Hinweis-Pfeil
    const y = 520 + Math.sin(performance.now() / 250) * 8;
    ctx.fillStyle = 'rgba(253,225,0,.9)'; ctx.font = '800 18px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('⬆  Wisch vom Ball nach oben', CX, y + 150);
  }

  drawScore();

  // Banner
  if (banner) {
    const a = banner.t < 0.12 ? banner.t / 0.12 : banner.t > banner.dur - 0.25 ? clamp((banner.dur - banner.t) / 0.25, 0, 1) : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(CX, 420); const sc = 0.8 + 0.2 * Math.min(1, banner.t * 8); ctx.scale(sc, sc);
    ctx.font = `900 ${banner.size}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round'; ctx.strokeText(banner.text, 0, 0);
    ctx.fillStyle = banner.color; ctx.fillText(banner.text, 0, 0); ctx.restore();
  }
}

// ---------- Hauptschleife ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  keeperIdle += dt;
  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }
  if (shot && !shot.ended) {
    shot.s += dt;
    if (!shot.done && shot.s >= KICK_LEAD + shot.dur) { shot.done = true; finishShot(); }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Test-Zugriff
window.__game = { get res() { return res; }, get phase() { return phase; }, launch, calcTarget, resolveMine };
})();
</script>
</body>
