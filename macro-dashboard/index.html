<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Makro-Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/4.1.1/plotly-basic.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2; --surface-1: #fcfcfb; --border: #e1e0dc;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a8984;
    --grid: #ebeae6; --rec: rgba(120,120,115,.14);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --good: #1a7f37; --warn: #9a6700; --crit: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #121211; --surface-1: #1a1a19; --border: #2e2e2c;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
      --grid: #2a2a28; --rec: rgba(200,200,190,.12);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --good: #4cc16a; --warn: #e3b341; --crit: #f0605d;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface-1: #1a1a19; --border: #2e2e2c;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --grid: #2a2a28; --rec: rgba(200,200,190,.12);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --good: #4cc16a; --warn: #e3b341; --crit: #f0605d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-primary);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
  .ranges { display: flex; gap: 4px; }
  .ranges button { background: var(--surface-1); color: var(--text-secondary); border: 1px solid var(--border);
                   padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  .ranges button[aria-pressed="true"] { color: var(--text-primary); border-color: var(--text-secondary); font-weight: 600; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .signals { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .signal .lbl { color: var(--text-secondary); font-size: 12px; }
  .signal .val { font-size: 22px; font-weight: 650; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .signal .state { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .s-good { color: var(--good); } .s-warn { color: var(--warn); } .s-crit { color: var(--crit); }
  h2 { font-size: 15px; margin: 26px 0 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .chart-title { font-weight: 600; }
  .chart-last { font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-secondary); margin: 4px 0 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .plot { height: 230px; }
  footer { margin-top: 28px; color: var(--text-muted); font-size: 12px; }
  .err { color: var(--crit); padding: 24px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>US Makro-Dashboard</h1>
      <div class="sub" id="updated">Lade Daten …</div>
    </div>
    <div class="ranges" id="ranges" role="group" aria-label="Zeitraum"></div>
  </header>

  <section class="signals" id="signals" aria-label="Signale"></section>
  <div id="panels"></div>

  <footer>Quelle: FRED (Federal Reserve Bank of St. Louis). Graue Flächen = NBER-Rezessionen. Signalschwellen sind einfache Faustregeln, keine Anlageberatung.</footer>
</div>

<script>
// Fokus: US-Aktien und Krypto. Die übrigen Reihen liegen weiter in data/us.json (siehe fetch_data.py)
const PANELS = [
  { title: "Liquidität", charts: [
    { title: "Global M2 (G4: US, EZ, JP, UK) YoY", series: ["GLOBALM2_YOY"], fmt: v => v.toFixed(1) + " %", zero: true },
    { title: "Global M2 G4 in USD", series: ["GLOBALM2"], fmt: v => v.toFixed(1) + " Bio." },
    { title: "Fed-Bilanzsumme", series: ["WALCL"], fmt: v => (v / 1e6).toFixed(2) + " Bio. USD" },
  ]},
  { title: "Zinsen & Dollar", charts: [
    { title: "Fed Funds Rate", series: ["FEDFUNDS"], fmt: v => v.toFixed(2) + " %" },
    { title: "10J Realzins (TIPS)", series: ["DFII10"], fmt: v => v.toFixed(2) + " %", zero: true },
    { title: "Zinskurve 10J–3M (Inversion < 0)", series: ["T10Y3M"], fmt: v => v.toFixed(2) + " pp", zero: true },
    { title: "US-Dollar-Index (breit)", series: ["DTWEXBGS"], fmt: v => v.toFixed(1) },
  ]},
  { title: "Kredit & Stress", charts: [
    { title: "High-Yield Credit Spread", series: ["BAMLH0A0HYM2"], fmt: v => v.toFixed(2) + " pp" },
    { title: "VIX", series: ["VIXCLS"], fmt: v => v.toFixed(1) },
    { title: "Finanzbedingungen NFCI (> 0 = restriktiv)", series: ["NFCI"], fmt: v => v.toFixed(2), zero: true },
  ]},
  { title: "Bewertung S&P 500", charts: [
    { title: "Shiller-KGV (CAPE)", series: ["SPX_CAPE"], fmt: v => v.toFixed(1) },
    { title: "KGV (trailing)", series: ["SPX_PE"], fmt: v => v.toFixed(1) },
    { title: "Gewinnrendite minus 10J-Rendite", series: ["SPX_ERP"], fmt: v => v.toFixed(2) + " pp", zero: true },
  ]},
  { title: "Risikoassets", charts: [
    { title: "S&P 500", series: ["SP500"], fmt: v => v.toLocaleString("de-DE", {maximumFractionDigits: 0}), log: true },
    { title: "Bitcoin (USD)", series: ["CBBTCUSD"], fmt: v => "$" + Math.round(v).toLocaleString("de-DE"), log: true },
  ]},
  { title: "Makro-Bremse", charts: [
    { title: "Kern-PCE (Fed-Zielgröße, YoY)", series: ["PCEPILFE"], fmt: v => v.toFixed(2) + " %", ref: 2 },
    { title: "Sahm-Rule (Rezessionssignal ab 0,5)", series: ["SAHMREALTIME"], fmt: v => v.toFixed(2) + " pp", ref: 0.5 },
  ]},
];

// Signale: [Label, Serie, Formatierer, Bewertungsfunktion -> "good"|"warn"|"crit"]
const SIGNALS = [
  ["Global M2 (YoY)", "GLOBALM2_YOY", v => v.toFixed(1) + " %", v => v < 0 ? "crit" : v < 4 ? "warn" : "good"],
  ["10J Realzins", "DFII10", v => v.toFixed(2) + " %", v => v > 2.5 ? "crit" : v > 1.5 ? "warn" : "good"],
  ["Zinskurve 10J–3M", "T10Y3M", v => v.toFixed(2) + " pp", v => v < 0 ? "crit" : v < 0.5 ? "warn" : "good"],
  ["Credit Spread (HY)", "BAMLH0A0HYM2", v => v.toFixed(2) + " pp", v => v > 5 ? "crit" : v > 4 ? "warn" : "good"],
  ["VIX", "VIXCLS", v => v.toFixed(1), v => v > 30 ? "crit" : v > 20 ? "warn" : "good"],
  ["Finanzbedingungen (NFCI)", "NFCI", v => v.toFixed(2), v => v > 0 ? "crit" : v > -0.3 ? "warn" : "good"],
  ["Shiller-KGV (CAPE)", "SPX_CAPE", v => v.toFixed(1), v => v > 35 ? "crit" : v > 28 ? "warn" : "good"],
  ["Kern-PCE (YoY)", "PCEPILFE", v => v.toFixed(2) + " %", v => v > 3 ? "crit" : v > 2.5 ? "warn" : "good"],
  ["Sahm-Rule", "SAHMREALTIME", v => v.toFixed(2) + " pp", v => v >= 0.5 ? "crit" : v >= 0.3 ? "warn" : "good"],
];
const STATE = { good: ["●", "Unauffällig"], warn: ["▲", "Erhöht"], crit: ["■", "Alarm"] };
const RANGES = [["5J", 5], ["10J", 10], ["25J", 25], ["Max", 0]];

let DATA, rangeYears = 10, recessions = [];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const last = s => s.points[s.points.length - 1];

function computeRecessions() {
  const pts = DATA.series.USREC.points; recessions = []; let start = null;
  pts.forEach(([d, v], i) => {
    if (v === 1 && !start) start = d;
    if (v === 0 && start) { recessions.push([start, pts[i - 1][0]]); start = null; }
  });
  if (start) recessions.push([start, pts[pts.length - 1][0]]);
}

function fromDate() {
  if (!rangeYears) return "0000-01-01";
  const d = new Date(); d.setFullYear(d.getFullYear() - rangeYears);
  return d.toISOString().slice(0, 10);
}

function renderSignals() {
  document.getElementById("signals").innerHTML = SIGNALS.map(([lbl, id, fmt, rate]) => {
    const s = DATA.series[id]; if (!s) return "";
    const [d, v] = last(s), st = rate(v), [icon, text] = STATE[st];
    return `<div class="card signal"><div class="lbl">${lbl}</div><div class="val">${fmt(v)}</div>
      <div class="state s-${st}"><span aria-hidden="true">${icon}</span>${text}</div>
      <div class="lbl">Stand ${d}</div></div>`;
  }).join("");
}

function buildLayout() {
  const panels = document.getElementById("panels");
  panels.innerHTML = PANELS.map((p, pi) => `<h2>${p.title}</h2><div class="grid">` + p.charts.map((c, ci) => {
    const colors = c.series.map((_, i) => `var(--series-${i + 1})`);
    const legend = c.series.length > 1
      ? `<div class="legend">${c.series.map((id, i) => `<span><i style="background:${colors[i]}"></i>${DATA.series[id].name.replace(/ \((YoY|USD Bio\.)\)/, "")}</span>`).join("")}</div>` : "";
    const [, v] = last(DATA.series[c.series[0]]);
    return `<div class="card"><div class="chart-head"><span class="chart-title">${c.title}</span>
      <span class="chart-last">${c.series.map(id => c.fmt(last(DATA.series[id])[1])).join(" · ")}</span></div>
      ${legend}<div class="plot" id="plot-${pi}-${ci}"></div></div>`;
  }).join("") + `</div>`).join("");
}

function drawCharts() {
  const from = fromDate(), grid = css("--grid"), muted = css("--text-muted"), text = css("--text-secondary");
  PANELS.forEach((p, pi) => p.charts.forEach((c, ci) => {
    const traces = c.series.map((id, i) => {
      const s = DATA.series[id], pts = s.points.filter(([d]) => d >= from);
      const base = { x: pts.map(p => p[0]), y: pts.map(p => p[1]), name: s.name.replace(/ \((YoY|USD Bio\.)\)/, ""),
        hovertemplate: "%{x|%b %Y}: %{y:.2f}<extra>" + s.name + "</extra>" };
      return c.bar
        ? { ...base, type: "bar", marker: { color: css("--series-1") } }
        : { ...base, type: "scatter", mode: "lines", line: { color: css(`--series-${i + 1}`), width: 2, shape: "linear" } };
    });
    const x0 = traces[0].x[0], x1 = traces[0].x[traces[0].x.length - 1];
    const shapes = recessions.filter(([a, b]) => b >= x0).map(([a, b]) => ({
      type: "rect", xref: "x", yref: "paper", x0: a < x0 ? x0 : a, x1: b, y0: 0, y1: 1,
      fillcolor: css("--rec"), line: { width: 0 }, layer: "below" }));
    const hline = (y, dash) => ({ type: "line", xref: "paper", x0: 0, x1: 1, yref: "y", y0: y, y1: y,
      line: { color: muted, width: 1, dash } });
    if (c.zero) shapes.push(hline(0, "solid"));
    if (c.ref != null) shapes.push(hline(c.ref, "dot"));
    Plotly.react(`plot-${pi}-${ci}`, traces, {
      margin: { l: 44, r: 8, t: 6, b: 24 }, showlegend: false,
      paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
      font: { color: text, size: 11 }, shapes, hovermode: "x unified", bargap: 0.25,
      xaxis: { gridcolor: grid, linecolor: grid, showgrid: false, range: [x0, x1] },
      yaxis: { gridcolor: grid, zeroline: false, type: c.log ? "log" : "linear", automargin: true },
      hoverlabel: { bgcolor: css("--surface-1"), bordercolor: grid, font: { color: css("--text-primary") } },
    }, { displayModeBar: false, responsive: true });
  }));
}

function buildRanges() {
  const el = document.getElementById("ranges");
  el.innerHTML = RANGES.map(([l, y]) => `<button data-y="${y}" aria-pressed="${y === rangeYears}">${l}</button>`).join("");
  el.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    rangeYears = +b.dataset.y;
    el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    drawCharts();
  };
}

fetch("data/us.json").then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById("updated").textContent = "Datenstand: " + new Date(d.updated).toLocaleString("de-DE") + " · Quelle FRED";
  computeRecessions(); renderSignals(); buildLayout(); buildRanges(); drawCharts();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawCharts);
}).catch(e => {
  document.getElementById("updated").innerHTML = `<span class="err">Daten konnten nicht geladen werden (${e}). Seite über einen Webserver öffnen: <code>python3 -m http.server</code></span>`;
});
</script>
</body>
</html>
